<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Spider Edition</title>
<style>
body{margin:0;padding:24px 14px;background:#101018;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{max-width:620px;margin:0 auto}
h1{margin:22px 0 6px;font-size:46px;letter-spacing:4px}
h1 span{color:#ed2939}
.subtitle{color:#ccccd5;margin:0 0 28px}
.panel{border:2px solid #b51e2b;border-radius:12px;padding:16px;background:#191923}
label{display:block;margin-bottom:10px;font-size:18px}
input{width:92%;max-width:480px;padding:14px 10px;border:2px solid #777783;border-radius:8px;font-size:18px;margin-bottom:12px}
button,.link{display:inline-block;padding:13px 18px;margin:5px;border:0;border-radius:8px;background:#d92335;color:white;font-size:17px;text-decoration:none}
.link{background:#292936;border:1px solid #777783}
.hint{color:#b9b9c4;font-size:13px;line-height:1.5;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<h1>NO<span>V</span>A</h1>
<p class="subtitle">SPIDER EDITION · SWITCH TEST</p>
<div class="panel">
<form action="https://www.google.com/search" method="get">
<label for="q">Was möchtest du suchen?</label>
<input id="q" name="q" type="text" placeholder="Suchbegriff eingeben">
<br><button type="submit">Google-Suche</button>
</form>
</div>
<h2>Schnellzugriffe</h2>
<a class="link" href="https://html.duckduckgo.com/html/">DuckDuckGo HTML</a>
<a class="link" href="https://www.wikipedia.org/">Wikipedia</a>
<a class="link" href="https://www.youtube.com/">YouTube</a>
<p class="hint">NOVA ist eine selbst erstellte Startseite. Ob eine Webseite auf der Switch funktioniert, hängt auch vom eingebauten Switch-Browser ab.</p>
</div>
</body>
</html>
