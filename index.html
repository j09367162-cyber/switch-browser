
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch Browser</title>
<style>
body {
  background: #202124;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 40px 10px;
}
h1 { font-size: 42px; }
input {
  width: 75%;
  max-width: 500px;
  padding: 15px;
  border-radius: 25px;
  border: none;
  font-size: 18px;
}
button {
  padding: 14px 25px;
  border: none;
  border-radius: 20px;
  margin: 10px;
  cursor: pointer;
}
a { color: #8ab4f8; font-size: 20px; }
</style>
</head>
<body>
<h1>Mein Switch Browser</h1>

<form action="https://www.google.com/search" method="GET">
<input name="q" placeholder="Google durchsuchen...">
<button type="submit">Suchen</button>
</form>

<p><a href="https://www.youtube.com">YouTube</a></p>
<p><a href="https://www.google.com">Google öffnen</a></p>

</body>
</html>
